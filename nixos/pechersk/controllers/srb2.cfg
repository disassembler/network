// Native analog movement, raw Atari SDL button indices are one-based here.
use_gamepad "1"
use_gamepad2 "2"
padscale "1"
padscale2 "1"
joyaxis_fire "None"
joyaxis_firenormal "None"
joyaxis2_fire "None"
joyaxis2_firenormal "None"
setcontrol "jump" "SPACE" "JOY1"
setcontrol "spin" "LSHIFT" "JOY3"
setcontrol "systemmenu" "ESCAPE" "JOY9"
setcontrol "screenshot" "F8"
setcontrol2 "jump" "sec_joy1"
setcontrol2 "spin" "sec_joy3"
setcontrol2 "systemmenu" "sec_joy9"
